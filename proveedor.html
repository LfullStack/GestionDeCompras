<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedor || Inventario Global</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body class="body-general">
    <h1 class="text-center mt-4 text-primary">INVENTARIO GLOBAL</h1>

    <!-- Navbar -->
    <div class="container proveedor ">
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-secondary">
            <div class="container">
                <h3 class="navbar-brand "><strong>Proveedor</strong></h3>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link text-light" href="index.html">Menu Principal</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="proveedor.html">Nuevo</a></li>
                        <li class="nav-item "><a class="nav-link text-light" data-bs-toggle="collapse" data-bs-target="#proveedorRegistrado" href="proveedor.html">Registrados</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- Formulario Registro -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">Registro de Proveedor</h2>
        
        <form class=" p-4 rounded formProveedor" id="formProveedor" >
            <div class="mb-3">
                <label for="nombreP" class="form-label">Nombre </label>
                <input type="text" class="form-control t border-light" id="nombreP" placeholder="Ej. Distribuciones S.A.">
            </div>
    
            <div class="mb-3">
                <label for="nitP" class="form-label">NIT</label>
                <input type="number" class="form-control  border-light" id="nitP" placeholder="Ej. 900123456-7">
            </div>
    
            <div class="mb-3">
                <label for="ubicacionP" class="form-label">Ubicación</label>
                <input type="text" class="form-control  border-light" id="ubicacionP" placeholder="Ciudad, Dirección">
            </div>
    
            <div class="mb-3">
                <label for="telefonoP" class="form-label">Teléfono</label>
                <input type="number" class="form-control  border-light" id="telefonoP" placeholder="Ej. 3001234567">
            </div>
    
            <button type="submit" class="btn btn-primary w-100">Registrar</button>
        </form>
    </div>
    <!-- Menú oculto de proveedores -->
    <div class="collapse mt-4" id="proveedorRegistrado">
        <div class="card card-body bg-secondary text-light">
            <h4>Proveedores Registrados</h4>
            <table class="table table-dark table-striped mt-3" id="tablaProveedores">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>NIT</th>
                        <th>Ubicación</th>
                        <th>Teléfono</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody id="listaProveedor">
                </tbody>
            </table>
        </div>
    </div>
    

    <!-- Footer -->
    <footer class="bg-dark text-light">
        <div class="container">
        <p>© 2025 Inventario Global. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
