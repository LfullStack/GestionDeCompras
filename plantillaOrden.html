<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orden de Compra || Inventario GLobal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="css/styles.css" rel="stylesheet" />
</head>
    <body class="bg-light">
    <!-- Plantilla Orden de compra -->
    <div class="container seccion-contenedor my-4">
        <div class="seccion-factura " id="factura">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="logo text-primary">GPT E-COMMERCE SA.  <span>Nit.98555252-0</span></div>
                <div class="text-end">
                    <h5>Orden de Compra # <span id="idFactura"></span></h5>
                    <p id="fecha">Fecha Emision:</p>
                    <p id="fecha">Promesa de entrega:</p>        
                </div>
            </div>
    
            <div class="mb-4">
                <h5>Proveedor:</h5>
                <ol id="datosCliente">
                    <li id="nombre"></li>
                    <li id="direccion"></li>
                    <li id="telefono"></li>
                    <li id="email"></li>
                </ol>
            </div>
    
            <table class="table table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>Producto</th>
                        <th>cantidad</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody id="productosEscogidos"></tbody>
            </table>
    
            <div class="d-flex justify-content-end">
                <table class="table w-auto">
                    <tbody>
                        <tr>
                            <th>Subtotal:</th>
                            <td id="subtotal">$</td>
                        </tr>
                        <tr>
                            <th>IVA (19%):</th>
                            <td id="iva"></td>
                        </tr>
                        <tr>
                            <th>Flete:</th>
                            <td id="flete">$</td>
                        </tr>
                        <tr class="table-success">
                            <th>Total a pagar:</th>
                            <td><strong id="totalPago">$</strong></td>
                        </tr>
                    </tbody>
                </table>
            </div>
    
            <div class="mt-4">
                <p><strong>Nota:</strong> Documento no valido como factura.</p>
            </div>
        </div>
    </div>

    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
